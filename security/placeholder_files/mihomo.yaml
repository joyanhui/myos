    filter: "(?i)sky-.*(日|jp|japan)"
    tolerance: 10
  - name: 🇺🇲自动sky美国
    type: url-test
    include-all: true
    filter: "(?i)sky-.*(美|us|unitedstates)"
    tolerance: 10

