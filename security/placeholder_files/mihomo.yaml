mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: "0.0.0.0:9090"
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
proxy-providers:
  skyone:
    url: "https://subb3xq6b.skyvpn.bond/link/xxxx"
    type: http
    interval: 600
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 300,
      }
    override:
      additional-prefix: "sky-"
  fenniao:
    url: "https://b.592851.xyz/api/v1/client/subscribe?token=xxxxxx"
    type: http
    interval: 600
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 300,
      }
    override:
      additional-prefix: "fn-"
  freeclash:
    url: "https://tt.vg/freeclash"
    type: http
    interval: 600
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 300,
      }
    override:
      additional-prefix: "fc-"

#proxies:
#  - name: 'DIRECT'
#    type: direct
#    udp: true

geodata-mode: true
geox-url:
  geoip: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://gh-proxy.com/https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.**.xiaomi.com"
    - "localhost.ptlogin2.qq.com" # QQ登录
  nameserver:
    #    - https://120.53.53.53/dns-query
    - 192.168.1.1
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    #    - https://120.53.53.53/dns-query
    - 192.168.1.1
    - https://223.5.5.5/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - 192.168.1.1
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"

