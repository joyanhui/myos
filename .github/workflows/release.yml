name: Build and release system images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: system-image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.detect.outputs.build }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Determine release version
        id: metadata
        run: |
          echo "tag=images-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Skip unchanged scheduled builds
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag=$(gh release list --repo "$GH_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$latest_tag" ]; then
            latest_sha=""
          else
            latest_sha=$(gh release view "$latest_tag" --repo "$GH_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
          fi
          if [ -z "$latest_sha" ] || [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-raw:
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure image builder permissions
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            sandbox = false

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: Build raw image and external EFI
        run: |
          mkdir -p artifacts
          echo "Building raw image"
          nix build --show-trace --print-build-logs --no-link --print-out-paths .#nixosConfigurations.raw_os_core_img_creat.config.system.build.image > raw-path
          raw_dir=$(cat raw-path)
          cp "$raw_dir/nixos.raw" artifacts/nixos.raw
          echo "Compressing raw image"
          raw_size=$(stat -c %s artifacts/nixos.raw)
          parts=$(( (raw_size + 1887436800 - 1) / 1887436800 ))
          if [ "$parts" -gt 1 ]; then
            7z a -t7z -mx=1 -v1800m artifacts/nixos.raw.7z artifacts/nixos.raw
            7z t artifacts/nixos.raw.7z.001
            find artifacts -maxdepth 1 -name 'nixos.raw.7z.*' -print -quit | grep -q .
          else
            7z a -t7z -mx=1 artifacts/nixos.raw.7z artifacts/nixos.raw
            7z t artifacts/nixos.raw.7z
            test -s artifacts/nixos.raw.7z
          fi
          rm artifacts/nixos.raw
          echo "Building external EFI"
          nix build --show-trace --print-build-logs --no-link --print-out-paths .#nixosConfigurations.raw_os_core_img_creat.config.system.build.rawOsExternalBootEfi > efi-path
          cp "$(cat efi-path)" artifacts/nixos-img.efi
          test -s artifacts/nixos-img.efi
          (cd artifacts && sha256sum nixos-img.efi nixos.raw.7z* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  build-iso:
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build maintenance ISO
        run: |
          nix build --show-trace --print-build-logs --no-link --print-out-paths .#nixosConfigurations.iso_installer.config.system.build.isoImage > iso-path
          mkdir -p artifacts
          iso=$(find "$(cat iso-path)" -maxdepth 2 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          cp "$iso" artifacts/iso-installer-x86_64-linux.iso
          (cd artifacts && sha256sum iso-installer-x86_64-linux.iso > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iso-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs:
      - detect-changes
      - build-raw
      - build-iso
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-changes.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir release-assets
          cp artifacts/raw-artifacts/* release-assets/
          cp artifacts/iso-artifacts/iso-installer-x86_64-linux.iso release-assets/
          (cd release-assets && sha256sum iso-installer-x86_64-linux.iso >> SHA256SUMS && sha256sum -c SHA256SUMS)
          for asset in release-assets/*; do
            test "$(stat -c %s "$asset")" -lt 2147483648
          done
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "System images $RELEASE_TAG" \
            --notes "Automated maintenance ISO and Raw OS artifacts built from $SOURCE_SHA. The raw image archive may be split into volumes; keep all .7z volumes together before extraction. Verify downloads with SHA256SUMS."
