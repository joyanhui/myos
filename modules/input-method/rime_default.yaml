# encoding: utf-8
config_version: '2025-02-24'

schema_list:
  - schema: rime_ice
  # - schema: t9 # 九宫格（仓输入法）
  # - schema: double_pinyin # 自然码双拼
  # - schema: double_pinyin_abc # 智能 ABC 双拼
  # - schema: double_pinyin_mspy # 微软双拼
  # - schema: double_pinyin_sogou # 搜狗双拼
  # - schema: double_pinyin_flypy # 小鹤双拼
  # - schema: double_pinyin_ziguang # 紫光双拼
  # - schema: double_pinyin_jiajia # 拼音加加双拼

menu:
  page_size: 9
  # alternative_select_labels: [ ①, ②, ③, ④, ⑤, ⑥, ⑦, ⑧, ⑨, ⑩ ]  # 修改候选项标签
  # alternative_select_keys: ASDFGHJKL  # 如编码字符占用数字键，则需另设选字键（注意在雾凇中，大写字母也作为编码了）

switcher:
  caption: 「方案选单」
  hotkeys:
    - F4
    - Control+grave
    - Control+Shift+grave
    # - Alt+grave
  save_options:
    - ascii_punct
    - traditionalization
    - emoji
    - full_shape
    - search_single_char
  fold_options: true
  abbreviate_options: true
  option_list_separator: ' / '

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: commit_code
    Shift_R: noop
    Control_L: noop
    Control_R: noop

punctuator:
  digit_separators: ',.:'
  # digit_separator_action: commit  # 关闭上述行为 librime >= 1.13.1
  full_shape:
    ' ': { commit: '　' }
    ',': { commit: ， }
    '.': { commit: 。 }
    '<': [《, 〈, «, ‹]
    '>': [》, 〉, », ›]
    '/': [／, ÷]
    '?': { commit: ？ }
    ';': { commit: ； }
    ':': { commit: ： }
    "'": { pair: ['‘', '’'] }
    '"': { pair: ['“', '”'] }
    '\': [、, ＼]
    '|': [·, ｜, '§', '¦']
    '`': ｀
    '~': ～
    '!': { commit: ！ }
    '@': [＠, ☯]
    '#': [＃, ⌘]
    '%': [％, '°', '℃']
    '$': [￥, '$', '€', '£', '¥', '¢', '¤']
    '^': { commit: …… }
    '&': ＆
    '*': [＊, ·, ・, ×, ※, ❂]
    '(': （
    ')': ）
    '-': －
    '_': ——
    '+': ＋
    '=': ＝
    '[': [「, 【, 〔, ［]
    ']': [」, 】, 〕, ］]
    '{': [『, 〖, ｛]
    '}': [』, 〗, ｝]
  half_shape:
    ',': '，'
    '.': '。'
    '<': '《'
    '>': '》'
    '/': '/'
    '?': '？'
    ';': '；'
    ':': '：'
    "'": { pair: ['‘', '’'] }
    '"': { pair: ['“', '”'] }
    '\': '、'
    '|': '|'
    '`': '`'
    '~': '~'
    '!': '！'
    '@': '@'
    '#': '#'
    '%': '%'
    '$': '¥'
    '^': '……'
    '&': '&'
    '*': '*'
    '(': '（'
    ')': '）'
    '-': '-'
    '_': ——
    '+': '+'
    '=': '='
    '[': '【'
    ']': '】'
    '{': '「'
    '}': '」'

recognizer:
  patterns:
    email: '^[A-Za-z][-_.0-9A-Za-z]*@.*$'
    url: '^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$'
    underscore: '^[A-Za-z]+_.*'
    # url_2: "^[A-Za-z]+[.].*"   # 句号不上屏，支持 google.com abc.txt 等网址或文件名，使用句号翻页时需要注释掉
    # colon: "^[A-Za-z]+:.*"     # 冒号不上屏

key_binder:
  select_first_character: 'bracketleft'
  select_last_character: 'bracketright'

  bindings:
    - { when: composing, accept: Shift+Tab, send: Shift+Left }
    - { when: composing, accept: Tab, send: Shift+Right }
    # - { when: has_menu, accept: Shift+Tab, send: Page_Up }
    # - { when: has_menu, accept: Tab, send: Page_Down }

    - { when: composing, accept: Alt+Left, send: Shift+Left }
    - { when: composing, accept: Alt+Right, send: Shift+Right }

    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

    # - { when: has_menu, accept: comma, send: Page_Up }
    # - { when: has_menu, accept: period, send: Page_Down }

    # - { when: has_menu, accept: bracketleft, send: Page_Up }
    # - { when: has_menu, accept: bracketright, send: Page_Down }

    # numbered_mode_switch:
    # - { when: always, select: .next, accept: Control+Shift+1 }                  # 在最近的两个方案之间切换
    # - { when: always, select: .next, accept: Control+Shift+exclam }             # 在最近的两个方案之间切换
    # - { when: always, toggle: ascii_mode, accept: Control+Shift+2 }             # 切换中英
    # - { when: always, toggle: ascii_mode, accept: Control+Shift+at }            # 切换中英
    - { when: always, toggle: ascii_punct, accept: Control+Shift+3 }
    - { when: always, toggle: ascii_punct, accept: Control+Shift+numbersign }
    - { when: always, toggle: traditionalization, accept: Control+Shift+4 }
    - { when: always, toggle: traditionalization, accept: Control+Shift+dollar }
    # - { when: always, toggle: full_shape, accept: Control+Shift+5 }             # 切换全半角
    # - { when: always, toggle: full_shape, accept: Control+Shift+percent }       # 切换全半角

    # optimized_mode_switch:
    # - { when: always, accept: Control+Shift+space, select: .next }
    # - { when: always, accept: Shift+space, toggle: ascii_mode }
    # - { when: always, accept: Control+comma, toggle: full_shape }
    # - { when: always, accept: Control+period, toggle: ascii_punct }
    # - { when: always, accept: Control+slash, toggle: traditionalization }

    - { accept: KP_0, send: 0, when: composing }
    - { accept: KP_1, send: 1, when: composing }
    - { accept: KP_2, send: 2, when: composing }
    - { accept: KP_3, send: 3, when: composing }
    - { accept: KP_4, send: 4, when: composing }
    - { accept: KP_5, send: 5, when: composing }
    - { accept: KP_6, send: 6, when: composing }
    - { accept: KP_7, send: 7, when: composing }
    - { accept: KP_8, send: 8, when: composing }
    - { accept: KP_9, send: 9, when: composing }
    - { accept: KP_Decimal, send: period, when: composing }
    - { accept: KP_Multiply, send: asterisk, when: composing }
    - { accept: KP_Add, send: plus, when: composing }
    - { accept: KP_Subtract, send: minus, when: composing }
    - { accept: KP_Divide, send: slash, when: composing }
