theme = "base16_terminal"

[keys.normal]
C-y = ":sh zellij run --floating --close-on-exit -- yazi >/dev/null 2>&1"
C-g = ":sh zellij run --floating --close-on-exit -- lazygit >/dev/null 2>&1"
C-t = ":sh zellij run --floating --close-on-exit -- zsh >/dev/null 2>&1"

[editor]
soft-wrap.enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"
