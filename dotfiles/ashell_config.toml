position = "Top"
layer = "Top"
outputs = "All"
enable_esc_key = true

[logging]
level = "warn"
target = "file"

[modules]
left = ["Workspaces"]
center = ["WindowTitle"]
right = [
  "SystemInfo",
  "Weather",
  "Lunar",
  "Tempo",
  "Tray",
  "Settings",
  "Power",
]

[[CustomModule]]
name = "Lunar"
command = "bar-lunar --calendar"
listen_cmd = "bar-lunar --ashell-listen"

[[CustomModule]]
name = "Weather"
command = "bar-weather --detail"
on_right_click = "bar-weather --picker"
on_scroll_up = "bar-weather --next"
on_scroll_down = "bar-weather --prev"
listen_cmd = "bar-weather --ashell-listen"

[[CustomModule]]
name = "Power"
command = "bar-power --detail"
listen_cmd = "bar-power --ashell-listen"

[workspaces]
visibility_mode = "MonitorSpecific"
group_by_monitor = false
indicator_format = "Name"

[window_title]
mode = "Title"
truncate_title_after_length = 80

[tempo]
clock_format = "%a %m-%d %H:%M"

[system_info]
indicators = [
  "Cpu",
  "Memory",
  "Temperature",
]
interval = 2

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80
format = "Percentage"

[system_info.memory]
warn_threshold = 70
alert_threshold = 85
format = "Percentage"

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80
sensor = "Cpu"
units = "Celsius"

[tray]
right_click = "Open"

[notifications]
show_timestamps = true
show_bodies = true
toast = true
toast_timeout = 5000
toast_limit = 5

[osd]
enabled = true
timeout = 1500
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[settings]
lock_cmd = "swaylock -f"
shutdown_cmd = "systemctl poweroff"
suspend_cmd = "systemctl suspend"
hibernate_cmd = "systemctl hibernate"
reboot_cmd = "systemctl reboot"
logout_cmd = "loginctl terminate-user $USER"
battery_format = "IconAndPercentage"
battery_hide_when_full = false
volume_step = 5
max_volume = 100
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"
enable_tooltips = true
indicators = [
  "IdleInhibitor",
  "PowerProfile",
  "Audio",
  "Microphone",
  "Bluetooth",
  "Network",
  "Vpn",
  "Brightness",
]

[appearance]
font_name = "Sarasa Gothic SC"
scale_factor = 1.0
opacity = 0.95
primary_color = "#9bd7c0"
success_color = "#a7d8b4"
warning_color = "#e7b778"
danger_color = "#f28b82"
text_color = "#e5eee9"
workspace_colors = ["#9bd7c0", "#8bbad0", "#c7a6d9", "#e7b778"]

[appearance.background_color]
base = "#101719"
weak = "#182225"
strong = "#22302f"

[appearance.bar]
surface = "solid"
radius = "xl"
margin = ["xxs", "md"]
padding = ["xxs", "md"]

[appearance.menu]
backdrop = 0.35
